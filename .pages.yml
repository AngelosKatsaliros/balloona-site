# Pages CMS settings (https://pagescms.org)
# Lets non-technical editors add photos from the browser at https://app.pagescms.org

media:
  input: images/uploads
  output: /images/uploads
  categories: [image]
  extensions: [jpg, jpeg, png, webp, heic]
  rename: safe

content:
  - name: gallery
    label: Δημιουργίες (φωτογραφίες)
    type: file
    path: _data/gallery.yml
    format: yaml
    list: true
    fields:
      - name: image
        label: Φωτογραφία
        type: image
        required: true
      - name: title
        label: Τίτλος
        type: string
        required: true
        description: Μικρή περιγραφή, π.χ. «Bobo μπαλόνι με όνομα»
        options:
          maxlength: 60
      - name: category
        label: Κατηγορία
        type: select
        required: true
        options:
          values:
            - name: dora
              label: Προσωποποιημένα δώρα
            - name: genethlia
              label: Γενέθλια
            - name: vaptiseis
              label: Βαπτίσεις & εκδηλώσεις

  - name: home
    label: Φωτογραφίες αρχικής σελίδας
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - name: hero
        label: Μεγάλη φωτογραφία στην κορυφή
        type: image
        required: true
        description: Καλύτερα οριζόντια φωτογραφία. Το πάνω μέρος της φαίνεται πάντα.
      - name: gift
        label: Κάρτα «Προσωποποιημένα δώρα»
        type: image
        required: true
      - name: birthday
        label: Κάρτα «Γενέθλια»
        type: image
        required: true
      - name: baptism
        label: Κάρτα «Βαπτίσεις & εκδηλώσεις»
        type: image
        required: true
      - name: about
        label: Φωτογραφία «Λίγα λόγια για εμένα»
        type: image
        required: true
